[project]
name = "mowl-to-garmin"
version = "0.1.0"
description = "Make .fit files look Garmin-recorded so Garmin Connect calculates Training Effect / Training Load"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morten Skriver" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["fit", "garmin", "garmin-connect", "cycling", "training-effect"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
mowl-to-garmin = "mowl_to_garmin.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# put() closes over loop variables but is only called within the same iteration
"src/mowl_to_garmin/fit.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
